name: Backend
on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Repo variable CI_RUNS_ON switches to a self-hosted runner, e.g. ["self-hosted","linux"]
    # (docs/ci-cd.md "Self-hosted runner"); unset = GitHub-hosted.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # The repo is public: never run pull requests from forks (this also protects a self-hosted runner).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # GitHub-hosted only: a self-hosted runner keeps ~/.gradle on disk.
          cache: ${{ vars.CI_RUNS_ON == '' && 'gradle' || '' }}
      - name: Test (Testcontainers starts PostgreSQL via the runner's Docker)
        run: ./gradlew --no-daemon test
      - name: Build jar
        run: ./gradlew --no-daemon bootJar -x test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests
          retention-days: 3
