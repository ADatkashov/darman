<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DARMAN Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo">+</span> DARMAN <small>Admin</small></div>
  <div id="who"></div>
  <button id="logout" hidden>Выйти</button>
</header>
<div id="demo-banner" hidden>ДЕМО-режим: данные вымышлены. Проверка рецептов здесь не заменяет лицензированного фармацевта.</div>
<main>
  <section id="login" class="card narrow">
    <h1>Вход для сотрудников</h1>
    <form id="login-form">
      <label>Телефон <input name="phone" placeholder="+7 7XX XXX XX XX" autocomplete="username" required></label>
      <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Войти</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>
  <section id="app" hidden>
    <nav id="tabs" role="tablist"></nav>
    <div id="view"></div>
  </section>
</main>
<script src="admin.js"></script>
</body>
</html>
