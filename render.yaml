# Render Blueprint: DARMAN backend (Docker) + Neon PostgreSQL (external, serverless).
# Create with: Render Dashboard → New → Blueprint → select this repo. See docs/deploy-render-neon.md.
#
# Profile "demo" (default below) = fictional catalog, demo OTP/payments/courier, seeded demo accounts — for staging/demos ONLY.
# Production ("prod") needs real OTP/payment adapters, a bootstrapped admin and real catalog data: see the guide before switching.
services:
  - type: web
    name: darman-backend
    runtime: docker
    region: frankfurt            # closest Render region to Kazakhstan; pick the Neon region next to it (aws-eu-central-1)
    plan: starter                # a persistent disk (prescription files) is not available on the free plan
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    disk:
      name: darman-private-storage
      mountPath: /data/private-storage
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo              # change to "prod" only after completing the production checklist
      # --- Neon (enter in the dashboard when the Blueprint is created; never commit) ---
      - key: DARMAN_DB_URL       # jdbc:postgresql://<DIRECT-neon-host>/<db>?sslmode=require   (no "-pooler" host, no channel_binding)
        sync: false
      - key: DARMAN_DB_USER
        sync: false
      - key: DARMAN_DB_PASSWORD
        sync: false
      # --- Neon-friendly pool settings (free Neon has a small connection limit and suspends idle computes) ---
      - key: DARMAN_DB_POOL_SIZE
        value: "5"
      - key: DARMAN_DB_MIN_IDLE
        value: "0"
      - key: DARMAN_DB_MAX_LIFETIME_MS
        value: "240000"
      - key: DARMAN_DB_CONNECT_TIMEOUT_MS
        value: "30000"
      # --- secrets generated by Render ---
      - key: DARMAN_JWT_SECRET
        generateValue: true
      - key: DARMAN_PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: DARMAN_DEMO_PASSWORD   # demo accounts' shared password; read it in the Render dashboard (Environment)
        generateValue: true
      - key: DARMAN_DEMO_AUTO_REVIEW
        value: "false"
      # --- app settings ---
      - key: DARMAN_STORAGE_PATH
        value: /data/private-storage
      - key: DARMAN_API_DOCS_ENABLED
        value: "true"            # set to "false" for production
      - key: DARMAN_CORS_ORIGINS  # only needed for browser clients on other origins
        value: ""
      - key: DARMAN_PRIVACY_URL
        sync: false
      - key: DARMAN_TERMS_URL
        sync: false
      - key: DARMAN_SUPPORT_PHONE
        sync: false
      # --- real SMS gateway (required when the demo OTP is not used) ---
      - key: DARMAN_SMS_GATEWAY_URL
        sync: false
      - key: DARMAN_SMS_API_KEY
        sync: false
      - key: DARMAN_SMS_SENDER
        value: DARMAN
